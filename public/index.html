<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 20px;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #222;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    #status {
      font-size: 12px;
      color: #888;
    }

    #status.connected { color: #4ade80; }
    #status.error { color: #f87171; }

    #system-prompt-bar {
      padding: 8px 20px;
      border-bottom: 1px solid #333;
      background: #1e1e1e;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #system-prompt-bar label {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
    }

    #system-prompt {
      flex: 1;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px 10px;
      color: #e0e0e0;
      font-size: 13px;
      font-family: inherit;
    }

    #system-prompt:focus { outline: none; border-color: #d4a574; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #d4a574;
      color: #1a1a1a;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: #2a2a2a;
      border: 1px solid #333;
      border-bottom-left-radius: 4px;
    }

    .message.assistant code {
      background: #1a1a1a;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }

    .message.assistant pre {
      background: #1a1a1a;
      padding: 12px;
      border-radius: 8px;
      margin: 8px 0;
      overflow-x: auto;
    }

    .message.assistant pre code {
      background: none;
      padding: 0;
    }

    .message.error {
      align-self: center;
      background: #3b1a1a;
      border: 1px solid #5c2626;
      color: #f87171;
      font-size: 13px;
    }

    .message.system {
      align-self: center;
      color: #888;
      font-size: 12px;
      background: none;
      padding: 4px;
    }

    #streaming-indicator {
      display: none;
      align-self: flex-start;
      color: #888;
      font-size: 13px;
      padding: 4px 16px;
    }

    #streaming-indicator.active { display: block; }

    #input-area {
      padding: 16px 20px;
      border-top: 1px solid #333;
      background: #222;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #prompt-input {
      flex: 1;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 12px 16px;
      color: #e0e0e0;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      max-height: 200px;
      min-height: 44px;
      line-height: 1.5;
    }

    #prompt-input:focus { outline: none; border-color: #d4a574; }

    #send-btn {
      background: #d4a574;
      color: #1a1a1a;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    #send-btn:hover { background: #c49464; }
    #send-btn:disabled { background: #555; color: #888; cursor: not-allowed; }

    #cancel-btn {
      background: #5c2626;
      color: #f87171;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    #cancel-btn.active { display: block; }

    #new-chat-btn {
      background: #333;
      color: #ccc;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      margin-left: auto;
    }

    #new-chat-btn:hover { background: #444; color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>Claude Chat <span style="color:#888;font-weight:400;font-size:13px">spike</span></h1>
    <button id="new-chat-btn">New Chat</button>
    <span id="status">connecting…</span>
  </header>

  <div id="system-prompt-bar">
    <label>System prompt:</label>
    <input id="system-prompt" type="text" placeholder="Optional — e.g. 'You are a design systems expert'" />
  </div>

  <div id="messages">
    <div class="message system">Send a message to test Claude Code integration</div>
  </div>

  <div id="streaming-indicator">Claude is thinking…</div>

  <div id="input-area">
    <textarea id="prompt-input" rows="1" placeholder="Message Claude…" autofocus></textarea>
    <button id="cancel-btn">Stop</button>
    <button id="send-btn">Send</button>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const statusEl = document.getElementById('status');
    const indicator = document.getElementById('streaming-indicator');
    const systemPromptInput = document.getElementById('system-prompt');

    let ws;
    let isStreaming = false;
    let currentAssistantEl = null;
    let currentText = '';
    let lastSessionId = null;

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => {
        statusEl.textContent = 'connected';
        statusEl.className = 'connected';
      };

      ws.onclose = () => {
        statusEl.textContent = 'disconnected — reconnecting…';
        statusEl.className = 'error';
        setTimeout(connect, 2000);
      };

      ws.onmessage = (e) => {
        const event = JSON.parse(e.data);
        handleEvent(event);
      };
    }

    function handleEvent(event) {
      // Claude Code stream-json events
      switch (event.type) {
        case 'system':
          // Session info — capture session ID
          if (event.session_id) {
            lastSessionId = event.session_id;
            addSystemMessage(`Session: ${event.session_id.slice(0, 8)}…`);
          }
          break;

        case 'assistant':
          // Assistant message with content blocks
          if (event.message?.content) {
            for (const block of event.message.content) {
              if (block.type === 'text') {
                appendAssistantText(block.text);
              }
            }
          }
          break;

        case 'content_block_delta':
          // Streaming text delta
          if (event.delta?.type === 'text_delta') {
            appendAssistantText(event.delta.text);
          }
          break;

        case 'result':
          // Final result
          if (event.result) {
            // If we haven't started an assistant message yet, show the result
            if (!currentAssistantEl) {
              appendAssistantText(event.result);
            }
            if (event.session_id) {
              lastSessionId = event.session_id;
            }
          }
          finishStreaming();
          break;

        case 'done':
          finishStreaming();
          break;

        case 'error':
          addErrorMessage(event.error);
          finishStreaming();
          break;

        default:
          // Log unknown events for debugging
          console.log('Unknown event:', event);
      }
    }

    function appendAssistantText(text) {
      if (!currentAssistantEl) {
        currentAssistantEl = document.createElement('div');
        currentAssistantEl.className = 'message assistant';
        messages.appendChild(currentAssistantEl);
        currentText = '';
      }
      currentText += text;
      currentAssistantEl.textContent = currentText;
      messages.scrollTop = messages.scrollHeight;
    }

    function addUserMessage(text) {
      const el = document.createElement('div');
      el.className = 'message user';
      el.textContent = text;
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
    }

    function addSystemMessage(text) {
      const el = document.createElement('div');
      el.className = 'message system';
      el.textContent = text;
      messages.appendChild(el);
    }

    function addErrorMessage(text) {
      const el = document.createElement('div');
      el.className = 'message error';
      el.textContent = text;
      messages.appendChild(el);
    }

    function startStreaming() {
      isStreaming = true;
      sendBtn.disabled = true;
      cancelBtn.classList.add('active');
      indicator.classList.add('active');
      currentAssistantEl = null;
      currentText = '';
    }

    function finishStreaming() {
      isStreaming = false;
      sendBtn.disabled = false;
      cancelBtn.classList.remove('active');
      indicator.classList.remove('active');
      currentAssistantEl = null;
    }

    function send() {
      const prompt = input.value.trim();
      if (!prompt || isStreaming) return;

      addUserMessage(prompt);
      startStreaming();

      const payload = { type: 'prompt', prompt };

      const sp = systemPromptInput.value.trim();
      if (sp) payload.systemPrompt = sp;

      // For conversation continuity, pass session ID after first message
      // (disabled for spike — each message is independent)
      // if (lastSessionId) payload.sessionId = lastSessionId;

      ws.send(JSON.stringify(payload));
      input.value = '';
      autoResize();
    }

    document.getElementById('new-chat-btn').onclick = () => {
      ws.send(JSON.stringify({ type: 'new-session' }));
      messages.innerHTML = '<div class="message system">New conversation started</div>';
      currentAssistantEl = null;
      currentText = '';
    };

    cancelBtn.onclick = () => {
      if (isStreaming) {
        ws.send(JSON.stringify({ type: 'cancel' }));
      }
    };

    sendBtn.onclick = send;

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    // Auto-resize textarea
    function autoResize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    }
    input.addEventListener('input', autoResize);

    connect();
  </script>
</body>
</html>
